<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Local • Mensagio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Título do projeto -->
    <header>
      <h1>Chat Local</h1>
      <p class="subtitle">Mensagio Tecnologia</p>
    </header>
    <!-- ========== TELA 1: Digitar o nome ========== -->
    <div id="tela-login" class="card">
      <h2>Como você quer ser chamado?</h2>
      <input
        type="text"
        id="input-nome"
        placeholder="Digite seu nome..."
        maxlength="20"
        autocomplete="off"
      >
      <button id="btn-entrar">Entrar no chat</button>
    </div>
    <!-- ========== TELA 2: O chat (começa escondida) ========== -->
    <div id="tela-chat" class="card escondido">
      <!-- Nome do usuário + botão sair -->
      <div class="cabecalho-chat">
        <span>Olá, <strong id="nome-usuario"></strong>!</span>
        <button id="btn-sair" class="btn-sair">Sair</button>
      </div>
      <!-- Lista de mensagens -->
      <div id="lista-mensagens" class="lista-mensagens"></div>
      <!-- Campo para digitar + botão enviar -->
      <div class="area-envio">
        <input
          type="text"
          id="input-mensagem"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
        >
        <button id="btn-enviar">Enviar</button>
      </div>
    </div>
  </div>
  <!-- Arquivo com a lógica do chat -->
  <script src="script.js"></script>
</body>
</html>
